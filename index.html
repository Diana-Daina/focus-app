<meta name="theme-color" content="#3d7a50" />
<title>Focus 🌿</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --s50:#f2f7f2;--s100:#daeeda;--s200:#b4dab4;--s400:#6aab7a;--s600:#3d7a50;--s800:#1e4a2e;--s900:#0f2a18;
  --bg:#ffffff;--bg2:#f5f8f5;--bg3:#edf4ed;--surface:#ffffff;
  --tx:#1a2e1a;--tx2:#4a6450;--tx3:#7a9a80;
  --bd:rgba(61,122,80,0.15);--bd2:rgba(61,122,80,0.28);
  --accent:#3d7a50;--accent-light:#daeeda;--accent-dark:#1e4a2e;
  --radius-md:10px;--radius-lg:14px;
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
.dark{
  --bg:#0f1a12;--bg2:#162019;--bg3:#1c2a1e;--surface:#1c2a1e;
  --tx:#d4ebd8;--tx2:#8ab890;--tx3:#5a8060;
  --bd:rgba(106,171,122,0.15);--bd2:rgba(106,171,122,0.28);
  --accent:#6aab7a;--accent-light:#1e4a2e;--accent-dark:#b4dab4;
}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:var(--font);transition:background .3s,color .3s}
.app{max-width:480px;margin:0 auto;padding:16px 14px 80px;min-height:100vh}
.hidden{display:none!important}

/* Top bar */
.top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.app-name{font-size:20px;font-weight:600;color:var(--tx)}
.top-right{display:flex;align-items:center;gap:8px}
.dark-toggle{width:44px;height:26px;border-radius:99px;background:var(--bg3);border:1px solid var(--bd2);cursor:pointer;position:relative;transition:background .3s;flex-shrink:0}
.dark-toggle::after{content:'';position:absolute;top:4px;left:4px;width:18px;height:18px;border-radius:50%;background:var(--accent);transition:left .3s}
.dark .dark-toggle::after{left:22px}
.xp-row{display:flex;align-items:center;gap:6px}
.xp-bar{width:72px;height:5px;background:var(--bg3);border-radius:99px;overflow:hidden}
.xp-fill{height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.pill{font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--accent-light);color:var(--accent-dark)}

/* Nav tabs */
.nav{display:flex;gap:0;margin-bottom:14px;background:var(--bg3);border-radius:var(--radius-lg);padding:3px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.nav::-webkit-scrollbar{display:none}
.nav-btn{flex:1;min-width:64px;font-size:11px;font-weight:500;padding:7px 4px;border-radius:var(--radius-md);border:none;background:transparent;color:var(--tx2);cursor:pointer;white-space:nowrap;transition:all .2s}
.nav-btn.active{background:var(--accent);color:#fff}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:14px}
.stat{background:var(--bg3);border-radius:var(--radius-md);padding:10px 6px;text-align:center}
.stat-num{font-size:20px;font-weight:600;color:var(--tx)}
.stat-lbl{font-size:10px;color:var(--tx3);margin-top:1px}

/* Section label */
.sec-lbl{font-size:11px;font-weight:600;color:var(--tx3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}

/* Add form */
.add-form{display:flex;flex-direction:column;gap:7px;margin-bottom:12px}
.add-form input[type=text]{width:100%;background:var(--bg2);border:1px solid var(--bd2);border-radius:var(--radius-md);color:var(--tx);padding:0 12px;height:42px;font-size:15px;font-family:var(--font)}
.add-form input[type=text]::placeholder{color:var(--tx3)}
.add-form input[type=text]:focus{outline:none;border-color:var(--accent)}
.form-row{display:flex;gap:7px}
.form-row select,.form-row input[type=date]{flex:1;background:var(--bg2);border:1px solid var(--bd2);border-radius:var(--radius-md);color:var(--tx);padding:0 8px;height:38px;font-size:13px;font-family:var(--font)}
.btn-primary{width:100%;background:var(--accent);color:#fff;border:none;border-radius:var(--radius-md);padding:0 14px;font-size:15px;font-weight:600;cursor:pointer;height:42px;transition:opacity .2s;font-family:var(--font)}
.btn-primary:active{opacity:.8}

/* Filters */
.filters{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}
.filters::-webkit-scrollbar{display:none}
.filter-btn{flex-shrink:0;font-size:12px;padding:5px 12px;border-radius:99px;border:1px solid var(--bd2);background:transparent;color:var(--tx2);cursor:pointer}
.filter-btn.active{background:var(--accent-light);color:var(--accent-dark);border-color:var(--s200)}

/* Task cards */
.task-list{display:flex;flex-direction:column;gap:8px}
.task-card{background:var(--surface);border:1px solid var(--bd);border-radius:var(--radius-lg);padding:12px 14px;display:flex;align-items:flex-start;gap:10px}
.task-card.done{opacity:.45}
.task-card.done .task-title{text-decoration:line-through;color:var(--tx2)}
.check-btn{width:22px;height:22px;min-width:22px;border-radius:50%;border:2px solid var(--bd2);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;margin-top:1px;transition:all .2s}
.check-btn.done{background:var(--accent);border-color:var(--accent)}
.task-info{flex:1;min-width:0}
.task-title{font-size:14px;color:var(--tx);line-height:1.4}
.task-meta{display:flex;gap:5px;margin-top:4px;flex-wrap:wrap;align-items:center}
.tag{font-size:10px;padding:2px 7px;border-radius:99px;font-weight:600}
.tag-proj{background:var(--bg3);color:var(--tx2)}
.tag-low{background:#edf7ed;color:#2d5e2d}.dark .tag-low{background:#1a3020;color:#8aba8a}
.tag-med{background:#fef6e4;color:#7a5500}.dark .tag-med{background:#2a1f08;color:#c9a84c}
.tag-high{background:#fef0ee;color:#8a2a1a}.dark .tag-high{background:#2a1208;color:#e08070}
.date-tag{font-size:10px;color:var(--tx3)}
.date-tag.overdue{color:#c0392b}
.task-actions{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.mini-btn{font-size:11px;padding:3px 9px;border-radius:99px;border:1px solid var(--bd2);background:transparent;color:var(--tx2);cursor:pointer}
.del-btn{border:none;background:transparent;color:var(--tx3);cursor:pointer;padding:2px 4px;font-size:13px;margin-left:auto}

/* Subtasks */
.subtasks{margin-top:8px;display:flex;flex-direction:column;gap:5px}
.subtask-row{display:flex;align-items:center;gap:7px}
.subtask-check{width:15px;height:15px;min-width:15px;border-radius:3px;border:1.5px solid var(--bd2);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:9px;color:#fff}
.subtask-check.done{background:var(--accent);border-color:var(--accent)}
.subtask-text{font-size:12px;color:var(--tx2)}
.subtask-text.done{text-decoration:line-through;color:var(--tx3)}
.subtask-add{display:flex;gap:6px;margin-top:6px}
.subtask-add input{flex:1;font-size:12px;height:30px;background:var(--bg2);border:1px solid var(--bd);border-radius:var(--radius-md);color:var(--tx);padding:0 8px;font-family:var(--font)}
.subtask-add input::placeholder{color:var(--tx3)}
.subtask-add button{font-size:11px;height:30px;padding:0 10px;border-radius:var(--radius-md);border:1px solid var(--bd2);background:transparent;cursor:pointer;color:var(--tx2);font-family:var(--font)}

.empty{text-align:center;color:var(--tx3);font-size:14px;padding:3rem 0}

/* Reward popup */
.reward-pop{position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);background:var(--surface);border:1px solid var(--bd2);border-radius:var(--radius-lg);padding:20px 28px;text-align:center;z-index:999;display:none;min-width:180px;box-shadow:0 8px 32px rgba(0,0,0,0.12)}
.reward-pop.show{display:block;animation:pop .3s ease}
@keyframes pop{from{opacity:0;top:44%}to{opacity:1;top:40%}}

/* Pomodoro */
.pom-wrap{display:flex;flex-direction:column;align-items:center;gap:16px;padding:8px 0}
.pom-sel select{width:100%;background:var(--bg2);border:1px solid var(--bd2);border-radius:var(--radius-md);color:var(--tx);padding:0 12px;height:40px;font-size:14px;font-family:var(--font)}
.pom-circle{width:200px;height:200px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.pom-time{font-size:48px;font-weight:600;color:var(--tx)}
.pom-label{font-size:13px;color:var(--tx2);margin-top:3px}
.pom-controls{display:flex;gap:10px}
.btn-outline{font-size:14px;padding:0 18px;height:42px;border-radius:var(--radius-md);border:1px solid var(--bd2);background:transparent;cursor:pointer;color:var(--tx2);font-family:var(--font)}
.dur-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.dur-btn{font-size:12px;padding:5px 12px;border-radius:99px;border:1px solid var(--bd2);background:transparent;color:var(--tx2);cursor:pointer}
.dur-btn.sel{background:var(--accent-light);color:var(--accent-dark);border-color:var(--s200)}

/* Focus mode */
.focus-wrap{display:flex;flex-direction:column;gap:12px;padding:4px 0}
.focus-sel{width:100%;background:var(--bg2);border:1px solid var(--bd2);border-radius:var(--radius-md);color:var(--tx);padding:0 12px;height:40px;font-size:14px;font-family:var(--font)}
.focus-card{background:var(--surface);border:2px solid var(--accent);border-radius:var(--radius-lg);padding:18px}
.focus-task-title{font-size:19px;font-weight:600;color:var(--tx);margin-bottom:10px;line-height:1.3}
.prog-bar{height:5px;background:var(--bg3);border-radius:99px;overflow:hidden;margin-bottom:12px}
.prog-fill{height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.focus-empty{text-align:center;color:var(--tx3);font-size:14px;padding:2.5rem 0}

/* Check-in */
.checkin-wrap{display:flex;flex-direction:column;gap:10px;padding:4px 0}
.checkin-slot{background:var(--surface);border:1px solid var(--bd);border-radius:var(--radius-lg);padding:12px 14px;display:flex;align-items:center;gap:10px}
.slot-num{width:26px;height:26px;border-radius:50%;background:var(--accent-light);color:var(--accent-dark);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.slot-sel{flex:1;background:var(--bg2);border:1px solid var(--bd);border-radius:var(--radius-md);color:var(--tx);padding:0 8px;height:34px;font-size:13px;font-family:var(--font)}
.slot-done{width:22px;height:22px;border-radius:50%;border:2px solid var(--bd2);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;flex-shrink:0}
.slot-done.done{background:var(--accent);border-color:var(--accent)}
.checkin-prog{height:6px;background:var(--bg3);border-radius:99px;overflow:hidden}
.checkin-fill{height:100%;background:var(--accent);border-radius:99px;transition:width .4s}

/* Streak */
.streak-wrap{display:flex;flex-direction:column;gap:12px;padding:4px 0}
.streak-big{text-align:center;padding:20px 0}
.streak-num{font-size:72px;font-weight:700;color:var(--accent);line-height:1}
.streak-sub{font-size:14px;color:var(--tx2);margin-top:6px}
.streak-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.streak-day{height:38px;border-radius:var(--radius-md);background:var(--bg3);border:1px solid var(--bd);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;color:var(--tx3)}
.streak-day.active{background:var(--accent-light);border-color:var(--s200);color:var(--accent-dark);font-weight:600}
.streak-day.today{border:2px solid var(--accent)}
.streak-lbl{font-size:9px;color:var(--tx3);text-align:center;margin-top:2px}

/* Bottom nav safe area */
@supports(padding-bottom:env(safe-area-inset-bottom)){
  .app{padding-bottom:calc(80px + env(safe-area-inset-bottom))}
}
</style>
</head>
<body>
<div class="app" id="app">

<div class="top-bar">
  <div class="app-name">🌿 Focus</div>
  <div class="top-right">
    <div class="xp-row">
      <span style="font-size:11px;color:var(--tx3)" id="xp-txt">0/100</span>
      <div class="xp-bar"><div class="xp-fill" id="xp-fill" style="width:0%"></div></div>
      <span class="pill" id="lvl-badge">Nv.1</span>
      <span class="pill" id="streak-badge">🔥 0</span>
    </div>
    <button class="dark-toggle" id="dark-toggle" onclick="toggleDark()"></button>
  </div>
</div>

<div class="nav">
  <button class="nav-btn active" onclick="showView('tasks',this)">Tareas</button>
  <button class="nav-btn" onclick="showView('checkin',this)">Check-in</button>
  <button class="nav-btn" onclick="showView('pomodoro',this)">Pomodoro</button>
  <button class="nav-btn" onclick="showView('focus',this)">Enfoque</button>
  <button class="nav-btn" onclick="showView('streak',this)">Racha</button>
</div>

<div class="stats">
  <div class="stat"><div class="stat-num" id="s-total">0</div><div class="stat-lbl">Total</div></div>
  <div class="stat"><div class="stat-num" id="s-done">0</div><div class="stat-lbl">Listas</div></div>
  <div class="stat"><div class="stat-num" id="s-pts">0</div><div class="stat-lbl">XP</div></div>
  <div class="stat"><div class="stat-num" id="s-poms">0</div><div class="stat-lbl">Pomodoros</div></div>
</div>

<!-- TAREAS -->
<div id="view-tasks">
  <div class="sec-lbl">Nueva tarea</div>
  <div class="add-form">
    <input type="text" id="inp-title" placeholder="¿Qué necesitas hacer?" />
    <div class="form-row">
      <select id="inp-proj"><option value="personal">Personal</option><option value="trabajo">Trabajo</option><option value="salud">Salud</option><option value="estudio">Estudio</option></select>
      <select id="inp-prio"><option value="low">Baja</option><option value="med">Media</option><option value="high">Alta</option></select>
    </div>
    <div class="form-row">
      <input type="date" id="inp-date" style="width:100%" />
    </div>
    <button class="btn-primary" onclick="addTask()">+ Agregar tarea</button>
  </div>
  <div class="filters">
    <button class="filter-btn active" onclick="setFilter('all',this)">Todas</button>
    <button class="filter-btn" onclick="setFilter('pending',this)">Pendientes</button>
    <button class="filter-btn" onclick="setFilter('done',this)">Completadas</button>
    <button class="filter-btn" onclick="setFilter('high',this)">Alta prioridad</button>
    <button class="filter-btn" onclick="setFilter('overdue',this)">Vencidas</button>
  </div>
  <div class="task-list" id="task-list"></div>
</div>

<!-- CHECK-IN -->
<div id="view-checkin" class="hidden checkin-wrap">
  <div class="sec-lbl">Mis 3 tareas más importantes hoy</div>
  <div id="checkin-slots"></div>
  <div>
    <div class="checkin-prog"><div class="checkin-fill" id="checkin-fill" style="width:0%"></div></div>
    <div style="font-size:11px;color:var(--tx3);margin-top:5px;text-align:center" id="checkin-pct">0 de 3 completadas</div>
  </div>
</div>

<!-- POMODORO -->
<div id="view-pomodoro" class="hidden pom-wrap">
  <div class="pom-sel" style="width:100%">
    <div class="sec-lbl">Tarea activa</div>
    <select id="pom-task-sel"><option value="">— Selecciona una tarea —</option></select>
  </div>
  <div class="pom-circle">
    <svg style="position:absolute;top:0;left:0;width:100%;height:100%" viewBox="0 0 200 200">
      <circle cx="100" cy="100" r="93" fill="none" stroke-width="4" stroke="var(--bd)"/>
      <circle id="pom-arc" cx="100" cy="100" r="93" fill="none" stroke-width="4" stroke="var(--accent)" stroke-dasharray="584" stroke-dashoffset="584" stroke-linecap="round" transform="rotate(-90 100 100)" style="transition:stroke-dashoffset .5s"/>
    </svg>
    <div class="pom-time" id="pom-display">25:00</div>
    <div class="pom-label" id="pom-lbl">Enfoque</div>
  </div>
  <div style="font-size:12px;color:var(--tx3)"><span id="pom-cycles">0</span> pomodoros hoy</div>
  <div class="pom-controls">
    <button class="btn-primary" onclick="pomAction()" id="pom-btn" style="width:120px">Iniciar</button>
    <button class="btn-outline" onclick="pomReset()">Reiniciar</button>
  </div>
  <div class="dur-row">
    <button class="dur-btn sel" onclick="setPomDur(25,5,this)">25/5 min</button>
    <button class="dur-btn" onclick="setPomDur(50,10,this)">50/10 min</button>
    <button class="dur-btn" onclick="setPomDur(15,3,this)">15/3 min</button>
  </div>
</div>

<!-- ENFOQUE -->
<div id="view-focus" class="hidden focus-wrap">
  <div class="sec-lbl">Tarea de enfoque</div>
  <select class="focus-sel" id="focus-sel" onchange="updateFocus()"><option value="">— Elige una tarea pendiente —</option></select>
  <div id="focus-content"><div class="focus-empty">Selecciona una tarea para activar el modo enfoque</div></div>
</div>

<!-- RACHA -->
<div id="view-streak" class="hidden streak-wrap">
  <div class="streak-big">
    <div class="streak-num" id="streak-num">0</div>
    <div class="streak-sub">días de racha</div>
  </div>
  <div class="sec-lbl">Últimas 2 semanas</div>
  <div class="streak-grid" id="streak-grid"></div>
</div>

<!-- REWARD -->
<div class="reward-pop" id="reward-pop">
  <div style="font-size:36px;margin-bottom:6px" id="r-emoji">🌿</div>
  <div style="font-size:16px;font-weight:600;color:var(--tx)" id="r-title">¡Completada!</div>
  <div style="font-size:13px;color:var(--tx2);margin-top:3px" id="r-sub">+10 XP</div>
</div>

</div><!-- .app -->

<script>
let tasks=[],xp=0,filter='all',nextId=1,poms=0;
let pomInterval=null,pomRunning=false,pomBreak=false;
let pomWork=25,pomRest=5,pomSecs=1500,pomTotal=1500;
let checkinSlots=[null,null,null],checkinDone=[false,false,false];
let activeDays=new Set();
const today=new Date().toDateString();

const projs={personal:'Personal',trabajo:'Trabajo',salud:'Salud',estudio:'Estudio'};
const prios={low:'Baja',med:'Media',high:'Alta'};
const xpMap={low:5,med:10,high:20};
const rewards=[{e:'🌿',t:'¡Tarea lista!'},{e:'✨',t:'¡En racha!'},{e:'🍃',t:'¡Sigue así!'},{e:'🌱',t:'¡Creciendo!'},{e:'🏆',t:'¡Excelente!'}];

// Persist data — with fallback for iOS local file (no localStorage)
let _memStore={};
const store={
  set(k,v){try{localStorage.setItem(k,v);}catch(e){_memStore[k]=v;}},
  get(k){try{return localStorage.getItem(k);}catch(e){return _memStore[k]||null;}}
};
function save(){
  try{
    store.set('focus_tasks',JSON.stringify(tasks));
    store.set('focus_xp',xp);
    store.set('focus_poms',poms);
    store.set('focus_days',JSON.stringify([...activeDays]));
    store.set('focus_dark',document.getElementById('app').classList.contains('dark')?'1':'0');
  }catch(e){}
}
function load(){
  try{
    const t=store.get('focus_tasks');if(t)tasks=JSON.parse(t);
    const x=store.get('focus_xp');if(x)xp=parseInt(x);
    const p=store.get('focus_poms');if(p)poms=parseInt(p);
    const d=store.get('focus_days');if(d)activeDays=new Set(JSON.parse(d));
    if(tasks.length)nextId=Math.max(...tasks.map(t=>t.id))+1;
    if(store.get('focus_dark')==='1'){document.getElementById('app').classList.add('dark');}
  }catch(e){}
}

function toggleDark(){
  document.getElementById('app').classList.toggle('dark');save();
}

function showView(v,el){
  ['tasks','checkin','pomodoro','focus','streak'].forEach(id=>document.getElementById('view-'+id).classList.add('hidden'));
  document.getElementById('view-'+v).classList.remove('hidden');
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  if(el) el.classList.add('active');
  if(v==='pomodoro') refreshPomSel();
  if(v==='focus') refreshFocusSel();
  if(v==='checkin') renderCheckin();
  if(v==='streak') renderStreak();
}

function addTask(){
  const t=document.getElementById('inp-title').value.trim();
  if(!t) return;
  tasks.unshift({id:nextId++,title:t,
    proj:document.getElementById('inp-proj').value,
    prio:document.getElementById('inp-prio').value,
    date:document.getElementById('inp-date').value,
    done:false,subtasks:[],showSubs:false});
  document.getElementById('inp-title').value='';
  render();save();
}
document.getElementById('inp-title').addEventListener('keydown',e=>{if(e.key==='Enter')addTask()});

function changePrio(id, val){
  const t=tasks.find(t=>t.id===id);
  if(!t) return;
  if(t.done){ xp=Math.max(0,xp-xpMap[t.prio]); xp+=xpMap[val]; }
  t.prio=val;
  render();save();
}

function toggleTask(id){
  const t=tasks.find(t=>t.id===id);if(!t)return;
  if(!t.done){t.done=true;xp+=xpMap[t.prio];activeDays.add(today);showReward(xpMap[t.prio]);}
  else{xp=Math.max(0,xp-xpMap[t.prio]);t.done=false;}
  render();save();
}
function deleteTask(id){
  const t=tasks.find(t=>t.id===id);
  if(t&&t.done)xp=Math.max(0,xp-xpMap[t.prio]);
  tasks=tasks.filter(t=>t.id!==id);render();save();
}
function toggleSubs(id){const t=tasks.find(t=>t.id===id);if(t)t.showSubs=!t.showSubs;render();}
function addSubtask(id){
  const inp=document.getElementById('sub-inp-'+id);
  if(!inp||!inp.value.trim())return;
  const t=tasks.find(t=>t.id===id);
  if(t){t.subtasks.push({text:inp.value.trim(),done:false});inp.value='';render();save();}
}
function toggleSubtask(tid,si){
  const t=tasks.find(t=>t.id===tid);
  if(t&&t.subtasks[si])t.subtasks[si].done=!t.subtasks[si].done;render();save();
}
function isOverdue(t){if(!t.date||t.done)return false;return new Date(t.date)<new Date(today);}
function fmtDate(d){if(!d)return'';const[y,m,day]=d.split('-');return`${day}/${m}/${y}`;}

function showReward(gain){
  const r=rewards[Math.floor(Math.random()*rewards.length)];
  const pop=document.getElementById('reward-pop');
  document.getElementById('r-emoji').textContent=r.e;
  document.getElementById('r-title').textContent=r.t;
  document.getElementById('r-sub').textContent=`+${gain} XP`;
  pop.classList.add('show');setTimeout(()=>pop.classList.remove('show'),1700);
}

function setFilter(f,el){
  filter=f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');render();
}

function render(){
  const done=tasks.filter(t=>t.done).length;
  document.getElementById('s-total').textContent=tasks.length;
  document.getElementById('s-done').textContent=done;
  document.getElementById('s-pts').textContent=xp;
  document.getElementById('s-poms').textContent=poms;
  const lvl=Math.floor(xp/100)+1,pct=xp%100;
  document.getElementById('xp-txt').textContent=`${pct}/100`;
  document.getElementById('xp-fill').style.width=pct+'%';
  document.getElementById('lvl-badge').textContent=`Nv.${lvl}`;
  document.getElementById('streak-badge').textContent=`🔥 ${activeDays.size}`;

  let filtered=tasks;
  if(filter==='pending') filtered=tasks.filter(t=>!t.done);
  else if(filter==='done') filtered=tasks.filter(t=>t.done);
  else if(filter==='high') filtered=tasks.filter(t=>t.prio==='high'&&!t.done);
  else if(filter==='overdue') filtered=tasks.filter(t=>isOverdue(t));

  const list=document.getElementById('task-list');
  if(!filtered.length){list.innerHTML='<div class="empty">No hay tareas aquí 🌿</div>';return;}
  list.innerHTML=filtered.map(t=>`
    <div class="task-card ${t.done?'done':''}">
      <button class="check-btn ${t.done?'done':''}" onclick="toggleTask(${t.id})">${t.done?'✓':''}</button>
      <div class="task-info">
        <div class="task-title">${t.title}</div>
        <div class="task-meta">
          <span class="tag tag-proj">${projs[t.proj]}</span>
          <select onchange="changePrio(${t.id},this.value)" onclick="event.stopPropagation()" style="font-size:10px;padding:2px 5px;border-radius:6px;border:1px solid var(--bd2);background:var(--bg2);color:var(--tx2);font-family:var(--font);cursor:pointer">
            <option value="low" ${t.prio==='low'?'selected':''}>🟢 Baja</option>
            <option value="med" ${t.prio==='med'?'selected':''}>🟡 Media</option>
            <option value="high" ${t.prio==='high'?'selected':''}>🔴 Alta</option>
          </select>
          ${t.date?`<span class="date-tag ${isOverdue(t)?'overdue':''}">${isOverdue(t)?'Vencida ':''}${fmtDate(t.date)}</span>`:''}
          <span style="font-size:10px;color:var(--accent)">+${xpMap[t.prio]} XP</span>
          ${t.subtasks.length?`<span style="font-size:10px;color:var(--tx3)">${t.subtasks.filter(s=>s.done).length}/${t.subtasks.length} pasos</span>`:''}
        </div>
        <div class="task-actions">
          <button class="mini-btn" onclick="toggleSubs(${t.id})">${t.showSubs?'▲ Cerrar':'▼ Dividir tarea'}</button>
        </div>
        ${t.showSubs?`
        <div class="subtasks">
          ${t.subtasks.map((s,i)=>`
            <div class="subtask-row">
              <button class="subtask-check ${s.done?'done':''}" onclick="toggleSubtask(${t.id},${i})">${s.done?'✓':''}</button>
              <span class="subtask-text ${s.done?'done':''}">${s.text}</span>
            </div>`).join('')}
          <div class="subtask-add">
            <input type="text" id="sub-inp-${t.id}" placeholder="Añadir paso..." />
            <button onclick="addSubtask(${t.id})">+ Paso</button>
          </div>
        </div>`:''}
      </div>
      <button class="del-btn" onclick="deleteTask(${t.id})">✕</button>
    </div>`).join('');
}

function refreshPomSel(){
  const sel=document.getElementById('pom-task-sel'),cur=sel.value;
  sel.innerHTML='<option value="">— Selecciona una tarea —</option>'+
    tasks.filter(t=>!t.done).map(t=>`<option value="${t.id}">${t.title}</option>`).join('');
  if(cur)sel.value=cur;
}
function refreshFocusSel(){
  const sel=document.getElementById('focus-sel'),cur=sel.value;
  sel.innerHTML='<option value="">— Elige una tarea pendiente —</option>'+
    tasks.filter(t=>!t.done).map(t=>`<option value="${t.id}">${t.title}</option>`).join('');
  if(cur){sel.value=cur;updateFocus();}
}
function updateFocus(){
  const id=parseInt(document.getElementById('focus-sel').value);
  const t=tasks.find(t=>t.id===id);
  const cont=document.getElementById('focus-content');
  if(!t){cont.innerHTML='<div class="focus-empty">Selecciona una tarea para activar el modo enfoque</div>';return;}
  const done=t.subtasks.filter(s=>s.done).length,total=t.subtasks.length;
  cont.innerHTML=`
    <div class="focus-card">
      <div class="focus-task-title">${t.title}</div>
      <div class="task-meta" style="margin-bottom:10px">
        <span class="tag tag-proj">${projs[t.proj]}</span>
        <span class="tag tag-${t.prio}">${prios[t.prio]}</span>
        ${t.date?`<span class="date-tag">${fmtDate(t.date)}</span>`:''}
      </div>
      ${total?`
        <div style="font-size:11px;color:var(--tx3);margin-bottom:5px">${done}/${total} pasos completados</div>
        <div class="prog-bar"><div class="prog-fill" style="width:${total?Math.round(done/total*100):0}%"></div></div>
        <div style="display:flex;flex-direction:column;gap:6px">
          ${t.subtasks.map((s,i)=>`
            <div class="subtask-row">
              <button class="subtask-check ${s.done?'done':''}" onclick="toggleSubtask(${t.id},${i});updateFocus()">${s.done?'✓':''}</button>
              <span class="subtask-text ${s.done?'done':''}">${s.text}</span>
            </div>`).join('')}
        </div>`:'<div style="font-size:12px;color:var(--tx3);margin-bottom:8px">Sin pasos. Divídela en Tareas.</div>'}
      <button class="btn-primary" style="margin-top:16px" onclick="toggleTask(${t.id});updateFocus()">Marcar como completada</button>
    </div>`;
}

function pomFmt(s){const m=Math.floor(s/60),ss=s%60;return`${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`}
function pomAction(){
  if(!pomRunning){
    pomRunning=true;document.getElementById('pom-btn').textContent='Pausar';
    pomInterval=setInterval(()=>{
      pomSecs--;
      if(pomSecs<=0){
        clearInterval(pomInterval);pomRunning=false;
        if(!pomBreak){poms++;activeDays.add(today);save();}
        pomBreak=!pomBreak;
        pomSecs=pomBreak?pomRest*60:pomWork*60;pomTotal=pomSecs;
        document.getElementById('pom-lbl').textContent=pomBreak?'Descanso':'Enfoque';
        document.getElementById('pom-btn').textContent='Iniciar';
        document.getElementById('pom-cycles').textContent=poms;
        document.getElementById('s-poms').textContent=poms;
        document.getElementById('streak-badge').textContent=`🔥 ${activeDays.size}`;
      }
      document.getElementById('pom-display').textContent=pomFmt(pomSecs);
      const circ=2*Math.PI*93;
      document.getElementById('pom-arc').style.strokeDashoffset=circ*(pomSecs/pomTotal);
    },1000);
  } else {
    clearInterval(pomInterval);pomRunning=false;
    document.getElementById('pom-btn').textContent='Continuar';
  }
}
function pomReset(){
  clearInterval(pomInterval);pomRunning=false;pomBreak=false;
  pomSecs=pomWork*60;pomTotal=pomWork*60;
  document.getElementById('pom-display').textContent=pomFmt(pomSecs);
  document.getElementById('pom-lbl').textContent='Enfoque';
  document.getElementById('pom-btn').textContent='Iniciar';
  document.getElementById('pom-arc').style.strokeDashoffset=2*Math.PI*93;
}
function setPomDur(w,r,el){
  pomWork=w;pomRest=r;pomReset();
  document.querySelectorAll('.dur-btn').forEach(b=>b.classList.remove('sel'));
  if(el)el.classList.add('sel');
}

function renderCheckin(){
  const pending=tasks.filter(t=>!t.done);
  document.getElementById('checkin-slots').innerHTML=[0,1,2].map(i=>`
    <div class="checkin-slot" style="margin-bottom:8px">
      <div class="slot-num">${i+1}</div>
      <select class="slot-sel" onchange="setCheckin(${i},this.value)">
        <option value="">— Elige una tarea —</option>
        ${pending.map(t=>`<option value="${t.id}" ${checkinSlots[i]==t.id?'selected':''}>${t.title}</option>`).join('')}
      </select>
      <button class="slot-done ${checkinDone[i]?'done':''}" onclick="doneCheckin(${i})">${checkinDone[i]?'✓':''}</button>
    </div>`).join('');
  const d=checkinDone.filter(Boolean).length;
  document.getElementById('checkin-fill').style.width=Math.round(d/3*100)+'%';
  document.getElementById('checkin-pct').textContent=`${d} de 3 completadas`;
}
function setCheckin(i,v){checkinSlots[i]=v?parseInt(v):null;}
function doneCheckin(i){
  if(!checkinSlots[i])return;
  checkinDone[i]=!checkinDone[i];
  const t=tasks.find(t=>t.id===checkinSlots[i]);
  if(t&&checkinDone[i]&&!t.done)toggleTask(checkinSlots[i]);
  renderCheckin();
}

function renderStreak(){
  document.getElementById('streak-num').textContent=activeDays.size;
  const days=['D','L','M','X','J','V','S'],cells=[];
  for(let i=13;i>=0;i--){
    const d=new Date();d.setDate(d.getDate()-i);
    const ds=d.toDateString();
    cells.push(`<div><div class="streak-day ${activeDays.has(ds)?'active':''} ${ds===today?'today':''}">${days[d.getDay()]}</div><div class="streak-lbl">${d.getDate()}</div></div>`);
  }
  document.getElementById('streak-grid').innerHTML=cells.join('');
}

load();render();
</script>
</body>
</html>
